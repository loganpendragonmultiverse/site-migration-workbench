# Include inside the production server block.
# Query-bearing requests deliberately return 400; this adapter covers query-free sources only.
location = "/merge-alpha" {
    if ($args != "") { return 400; }
    if ($request_uri != "/merge-alpha") { return 404; }
    return 301 https://example.com/bundle;
}
location = "/merge-beta" {
    if ($args != "") { return 400; }
    if ($request_uri != "/merge-beta") { return 404; }
    return 301 https://example.com/bundle;
}
location = "/obsolete" {
    if ($args != "") { return 400; }
    if ($request_uri != "/obsolete") { return 404; }
    return 410;
}
location = "/old-service" {
    if ($args != "") { return 400; }
    if ($request_uri != "/old-service") { return 404; }
    return 301 https://example.com/service;
}
