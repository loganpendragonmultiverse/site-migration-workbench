name: Release packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1 .
      - run: python -c 'import os; from smw import __version__; assert os.environ["GITHUB_REF_TYPE"] != "tag" or os.environ["GITHUB_REF_NAME"] == "v" + __version__'
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: mkdir -p evidence && python tests/check_artifacts.py
      - run: python -m pip install dist/*.whl && migration-workbench --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-packages
          path: dist/
          if-no-files-found: error
