[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "site-migration-workbench"
version = "0.1.0"
description = "Local migration decisions, frozen plans, deployment exports and verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["defusedxml==0.7.1"]
license = "MIT"
authors = [{name="Logan Pendragon Multiverse"}]

[project.scripts]
migration-workbench = "smw.app:main"

[tool.setuptools.package-data]
smw = ["*.html", "*.js", "*.css"]

[tool.setuptools]
packages = ["smw"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
